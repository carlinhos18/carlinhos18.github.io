<header class="sticky top-0 z-50 w-full backdrop-blur transition-colors duration-300 border-b border-gray-200 dark:border-gray-800 bg-light-bg/80 dark:bg-dark-bg/80">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex-shrink-0">
        <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-light-accent to-blue-500 dark:from-dark-accent dark:to-cyan-400">
          Carlos Lisboa Cristelo
        </h1>
      </div>
      <div>
        <button (click)="toggleTheme()" 
                class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors focus:outline-none"
                aria-label="Toggle Dark Mode">
          @if (themeService.isDarkMode()) {
            <!-- Sun Icon for Dark Mode (to switch to light) -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <!-- Moon Icon for Light Mode (to switch to dark) -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>
      </div>
    </div>
  </div>
</header>
