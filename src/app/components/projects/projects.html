<section id="projects" class="py-20" style="animation: fade-up 0.7s ease-out 0.1s both">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between mb-12">
      <div>
        <h2 class="text-3xl font-bold text-gray-900 dark:text-white sm:text-4xl">
          My Projects
        </h2>
        <p class="mt-4 text-xl text-gray-500 dark:text-gray-400">
          A collection of my recent work pulled straight from GitHub.
        </p>
      </div>
    </div>

    @if (loading()) {
      <div class="flex justify-center items-center py-24">
        <div class="flex items-center gap-3">
          <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary border-t-transparent"></div>
          <span class="text-lg font-medium text-gray-500 dark:text-gray-400">Loading projects...</span>
        </div>
      </div>
    } @else {
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 sm:gap-6 lg:gap-8">
        @for (repo of repos(); track repo.id) {
          <app-project-card [repo]="repo"></app-project-card>
        }
      </div>

      @if (repos().length === 0) {
        <div class="text-center py-20">
          <p class="text-lg text-gray-500 dark:text-gray-400">No projects available at the moment.</p>
        </div>
      }
    }
  </div>
</section>
