<section class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="mb-12 text-center">
    <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white sm:text-4xl">
      My Projects
    </h2>
    <p class="mt-4 text-xl text-gray-500 dark:text-gray-400">
      A collection of my recent work pulled straight from GitHub.
    </p>
  </div>

  @if (loading()) {
    <div class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-light-accent dark:border-dark-accent"></div>
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">
      @for (repo of repos(); track repo.id) {
        <app-project-card [repo]="repo"></app-project-card>
      }
    </div>
  }
</section>
