<!-- Floating Chat Assistant Button -->
<button
  type="button"
  (click)="toggleChat()"
  class="fixed bottom-6 right-6 z-50 flex items-center justify-center w-14 h-14 rounded-full bg-primary text-white shadow-lg shadow-primary/30 hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="isOpen() ? 'Close AI assistant' : 'Open AI assistant'"
>
  @if (isOpen()) {
    <!-- Close Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  } @else {
    <!-- Chat Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M8 16h.01M12 12h.01M12 16h.01M16 12h.01M16 16h.01M21 12c0 4.418-4.03 8-9 8a9.005 9.005 0 01-9-9c0-1.105.366-2.183.977-3.138" />
    </svg>
  }
</button>

<!-- Chat Assistant Panel -->
@if (isOpen()) {
  <div class="fixed bottom-24 right-6 z-50 w-[calc(100vw-3rem)] max-w-sm h-[28rem] flex flex-col bg-white dark:bg-gray-800 rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden">
    <!-- Header -->
    <div class="px-4 py-3 bg-primary text-white flex items-center justify-between">
      <div class="flex items-center">
        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold">Carlos AI</p>
          <p class="text-xs opacity-80">Ask me about Carlos</p>
        </div>
      </div>
      <button type="button" (click)="toggleChat()" class="text-white/90 hover:text-white transition-colors" aria-label="Close chat">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50 dark:bg-gray-900/50" id="chat-messages">
      @for (msg of messages(); track $index) {
        <div class="flex" [class.justify-end]="msg.role === 'user'">
          <div class="max-w-[80%] rounded-2xl px-4 py-2 text-sm shadow-sm"
               [class.bg-primary]="msg.role === 'user'"
               [class.text-white]="msg.role === 'user'"
               [class.bg-white]="msg.role === 'assistant'"
               [class.text-gray-800]="msg.role === 'assistant'"
               [class.dark:bg-gray-800]="msg.role === 'assistant'"
               [class.dark:text-gray-100]="msg.role === 'assistant'"
               [class.border]="msg.role === 'assistant'">
            {{ msg.content }}
          </div>
        </div>
      }
      @if (status() === 'sending') {
        <div class="flex justify-start">
          <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-sm px-4 py-2 text-sm text-gray-500 dark:text-gray-400 shadow-sm">
            Thinking...
          </div>
        </div>
      }
    </div>

    <!-- Input -->
    <div class="p-3 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
      <div class="flex items-end gap-2">
        <textarea
          [value]="input()"
          (input)="input.set($any($event.target).value)"
          (keydown.enter)="handleKeydown($any($event))"
          rows="1"
          placeholder="Ask about my projects..."
          class="flex-1 resize-none px-3 py-2 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700/50 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary transition-all text-sm"
          [disabled]="status() === 'sending'"
        ></textarea>
        <button
          type="button"
          (click)="sendMessage()"
          class="p-2 rounded-xl bg-primary text-white transition-all hover:bg-primary/90 hover:shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="status() === 'sending'"
          aria-label="Send message"
        >
          @if (status() === 'sending') {
            <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          }
        </button>
      </div>
      <p class="mt-2 text-xs text-gray-400 text-center">AI assistant can make mistakes. Check important info.</p>
    </div>
  </div>
}
